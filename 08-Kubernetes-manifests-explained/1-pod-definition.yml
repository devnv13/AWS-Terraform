# Pod API Objects Reference:
# https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/
apiVersion: v1 # String
kind: Pod # String
metadata: # dictionary object
  name: myapp-pod
  labels: # dictionary object
    app: myapp
spec:
  containers: # list
    - name: myapp
      image: devnv/java-app:latest
      ports:
        - containerPort: 8080
    - name: nginx-sidecar
      image: devnv/nginxweb:latest
      ports:
        - containerPort: 80      