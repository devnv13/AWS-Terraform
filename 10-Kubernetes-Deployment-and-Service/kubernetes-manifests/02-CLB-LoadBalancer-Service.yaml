apiVersion: v1
kind: Service 
metadata:
  name: nginxapp-lb-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-1,subnet-2" # Provide VPC Subnets
spec:
  type: LoadBalancer # ClusterIp, # NodePort
  selector:
    app: nginxapp
  ports: 
    - name: http
      port: 80 # Service Port
      targetPort: 80 # Container Port

# This will create a Classic Load Balancer
# AWS will be retiring the EC2-Classic network on August 15, 2022.      
