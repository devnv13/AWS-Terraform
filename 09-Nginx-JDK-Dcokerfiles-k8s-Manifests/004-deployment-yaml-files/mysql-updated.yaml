apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-demo
  labels:
    app: mysql-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-demo
  template:
    metadata:
      labels:
        app: mysql-demo
    spec:
      containers:
      - name: mysql-demo
        image: docker.io/devnv/mysql8-demo:1.0.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: rootpassword
        - name: MYSQL_DATABASE
          value: demo
        - name: MYSQL_USER
          value: demo_user
        - name: MYSQL_PASSWORD
          value: demo_password
        ports:
        - containerPort: 3306
        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 30
          periodSeconds: 60
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
      imagePullSecrets:
      - name: registrycred
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  labels:
    app: mysql-demo
spec:
  selector:
    app: mysql-demo
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: ClusterIP
