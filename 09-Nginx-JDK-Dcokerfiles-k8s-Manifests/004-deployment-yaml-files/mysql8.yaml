# Deployment YAML for MySQL pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-demo
  labels:
    app: mysql-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-demo
  template:
    metadata:
      labels:
        app: mysql-demo
    spec:
      containers:
      - name: mysql-demo
        image: docker.io/devnv/mysql8-demo:1.0.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: rootpassword
        - name: MYSQL_DATABASE
          value: demo
        - name: MYSQL_USER
          value: demo_user
        - name: MYSQL_PASSWORD
          value: demo_password
        ports:
        - containerPort: 3306
      imagePullSecrets:
      - name: registrycred
---

# Service YAML for MySQL pod
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql-demo
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: ClusterIP
